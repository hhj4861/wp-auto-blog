name: Blog Keyword Select

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      search_check_only:
        description: '검색 결과 API 접근·표본만 점검 (Codex·주제 선정·포스팅 없음)'
        type: boolean
        default: false
      candidate_check_only:
        description: 'CAK artifact 다운로드·지표 검증만 점검 (Codex·보고서·포스팅 없음)'
        type: boolean
        default: false
      auth_check_only:
        description: '기존 Secret으로 Codex 인증만 점검 (주제 생성·포스팅 없음)'
        type: boolean
        default: false
      research_check_only:
        description: 'Codex 웹검색·공식 본문 접근만 점검 (보고서·포스팅 없음)'
        type: boolean
        default: false
      top_n:
        description: '카테고리별 검증할 상위 주제 수 (1~5)'
        required: false
        default: '2'
        type: string
      category:
        description: '시장 탐색 카테고리'
        type: choice
        default: all
        options: [all, 취업, 생활정보, 건강]
  schedule:
    - cron: '30 0 * * *' # 09:30 KST: category reports before existing 11:00 posting

concurrency:
  group: trendpulse-general-posting
  cancel-in-progress: false

jobs:
  search-check:
    if: inputs.search_check_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Check actual search result availability
        env:
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_CUSTOM_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python scripts/check_market_search.py
  candidate-check:
    if: inputs.search_check_only != true && inputs.candidate_check_only == true && inputs.auth_check_only != true && inputs.research_check_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check CAK artifact transport
        env:
          GH_TOKEN: ${{ secrets.CODEX_SECRET_WRITE_TOKEN }}
        run: |
          python scripts/fetch_cak_candidates.py --require \
            --output "$RUNNER_TEMP/cak-keyword-candidates.json" \
            --status-file "$RUNNER_TEMP/cak-fetch-status.json"
      - name: Validate imported candidate measurements
        env:
          CAK_KEYWORD_CANDIDATES_FILE: ${{ runner.temp }}/cak-keyword-candidates.json
          CAK_KEYWORD_CANDIDATES_FETCH_STATUS_FILE: ${{ runner.temp }}/cak-fetch-status.json
        run: |
          python - <<'PY'
          import json, os
          from src.cak_candidates import load_candidate_export
          items, diagnostics = load_candidate_export(os.environ['CAK_KEYWORD_CANDIDATES_FILE'])
          print(json.dumps(diagnostics, ensure_ascii=False))
          if diagnostics['status'] not in {'ok', 'partial', 'empty'}:
              raise SystemExit(1)
          PY
  select:
    if: inputs.search_check_only != true && (inputs.candidate_check_only != true || inputs.auth_check_only == true || inputs.research_check_only == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLOG_CODEX_PUBLIC_AUTOMATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install requests loguru python-dotenv beautifulsoup4 pytrends
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Codex analyst
        run: npm install -g @openai/codex@0.153.4
      - name: Restore Codex analyst authentication
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          WORKER_ADMIN_TOKEN: ${{ secrets.CODEX_SECRET_WRITE_TOKEN }}
        run: |
          echo "BLOG_CODEX_HOME=$RUNNER_TEMP/trendpulse-codex" >> "$GITHUB_ENV"
          python scripts/codex_worker_auth.py restore
      - name: Check restored Codex authentication
        if: inputs.auth_check_only == true
        run: python scripts/check_codex_auth.py
      - name: Check native Codex web research
        if: inputs.research_check_only == true && inputs.auth_check_only != true
        run: python scripts/check_codex_research.py
      - name: Import measured CAK keyword candidates
        if: inputs.auth_check_only != true && inputs.research_check_only != true
        env:
          GH_TOKEN: ${{ secrets.CODEX_SECRET_WRITE_TOKEN }}
        run: |
          echo "CAK_KEYWORD_CANDIDATES_FILE=$RUNNER_TEMP/cak-keyword-candidates.json" >> "$GITHUB_ENV"
          echo "CAK_KEYWORD_CANDIDATES_FETCH_STATUS_FILE=$RUNNER_TEMP/cak-fetch-status.json" >> "$GITHUB_ENV"
          python scripts/fetch_cak_candidates.py \
            --output "$RUNNER_TEMP/cak-keyword-candidates.json" \
            --status-file "$RUNNER_TEMP/cak-fetch-status.json"
      - name: Discover and verify category topics
        if: inputs.auth_check_only != true && inputs.research_check_only != true
        env:
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_CUSTOM_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          WP_GENERAL_URL: ${{ secrets.WP_GENERAL_URL }}
          WP_GENERAL_USERNAME: ${{ secrets.WP_GENERAL_USERNAME }}
          WP_GENERAL_APP_PASSWORD: ${{ secrets.WP_GENERAL_APP_PASSWORD }}
          SELECT_TOP_N: ${{ inputs.top_n || '2' }}
          SELECT_CATEGORY: ${{ inputs.category || 'all' }}
        run: python scripts/select_blog_keywords.py --category "$SELECT_CATEGORY"
      - name: Save category research report
        if: always() && inputs.auth_check_only != true && inputs.research_check_only != true
        uses: actions/upload-artifact@v4
        with:
          name: category-market-topics
          path: data/category_market_topics.json
          if-no-files-found: warn
      - name: Commit verified report
        if: always() && inputs.auth_check_only != true && inputs.research_check_only != true && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ ! -f data/category_market_topics.json ]; then exit 0; fi
          git add data/category_market_topics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh category market research [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Persist refreshed Codex auth and clean up
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CODEX_SECRET_WRITE_TOKEN }}
        run: python scripts/codex_worker_auth.py persist
