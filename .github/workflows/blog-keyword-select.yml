name: Blog Keyword Select

permissions:
  contents: write  # 선정 결과(data/blog_targets.json) 커밋 → 로컬/후속단계 연결

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: '선정할 키워드 수'
        required: false
        default: '2'
        type: string
  schedule:
    - cron: '30 0 * * *'  # 매일 09:30 KST — 키워드 선정 + 스캘폴드 생성

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests loguru
      - name: Select blog keywords
        env:
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          WP_GENERAL_URL: ${{ secrets.WP_GENERAL_URL }}
          WP_GENERAL_USERNAME: ${{ secrets.WP_GENERAL_USERNAME }}
          WP_GENERAL_APP_PASSWORD: ${{ secrets.WP_GENERAL_APP_PASSWORD }}
          WP_TECH_URL: ${{ secrets.WP_TECH_URL }}
          WP_TECH_USERNAME: ${{ secrets.WP_TECH_USERNAME }}
          WP_TECH_APP_PASSWORD: ${{ secrets.WP_TECH_APP_PASSWORD }}
          SELECT_TOP_N: ${{ github.event.inputs.top_n }}
        run: python scripts/select_blog_keywords.py

      - name: Generate post scaffolds (선정 키워드 → 채우기용 캐논 스크립트)
        run: python scripts/scaffold_post.py

      - name: Commit selection + scaffolds
        run: |
          if [ -n "$(git status --porcelain data/blog_targets.json scripts/draft_*_trend.py 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git pull --rebase --autostash origin main || true
            git add data/blog_targets.json scripts/draft_*_trend.py
            git commit -m "chore(keywords): 동적 선정 + 스캘폴드 생성 [skip ci]" || true
            git push origin HEAD:main || true
          fi
