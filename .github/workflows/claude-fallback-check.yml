name: Claude Quota Fallback Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOG_CODEX_PUBLIC_AUTOMATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only diagnostic dependencies
        run: pip install requests beautifulsoup4 'claude-agent-sdk>=0.2.173'
      - name: Verify live Claude after simulated Codex quota
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/check_claude_fallback.py
