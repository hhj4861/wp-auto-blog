name: Reviewed KPF Draft Correction

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: '적용할 draft 포스트 ID'
        required: false
        default: '1894'
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Correct reviewed draft 1894 only
        env:
          WP_GENERAL_URL: ${{ secrets.WP_GENERAL_URL }}
          WP_GENERAL_USERNAME: ${{ secrets.WP_GENERAL_USERNAME }}
          WP_GENERAL_APP_PASSWORD: ${{ secrets.WP_GENERAL_APP_PASSWORD }}
          POC_POST_ID: ${{ github.event.inputs.post_id }}
        run: python scripts/repair_kpf_draft.py

      - name: Preserve correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpf-draft-review-${{ github.run_id }}
          path: ${{ runner.temp }}/kpf-draft-review/
          retention-days: 7
