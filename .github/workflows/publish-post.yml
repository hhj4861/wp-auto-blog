name: Enrich Published AI Tech Series
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Approved published IDs: 1838,1840,1843'
        required: true
        type: string
      apply:
        description: 'Update reviewed bodies and explanatory diagrams'
        type: boolean
        default: false
concurrency:
  group: trendpulse-ai-tech-series-20261006
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests Pillow beautifulsoup4
      - name: Update existing published bodies via API
        env:
          WP_GENERAL_URL: ${{ secrets.WP_GENERAL_URL }}
          WP_GENERAL_USERNAME: ${{ secrets.WP_GENERAL_USERNAME }}
          WP_GENERAL_APP_PASSWORD: ${{ secrets.WP_GENERAL_APP_PASSWORD }}
          POC_POST_ID: ${{ inputs.post_id }}
          APPLY: ${{ inputs.apply }}
          EDITORIAL_BACKUP_DIR: ${{ runner.temp }}/ai-tech-editorial-backups
        run: python scripts/update_ai_tech_series.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-tech-editorial-backups
          path: ${{ runner.temp }}/ai-tech-editorial-backups
          retention-days: 7
          if-no-files-found: ignore
