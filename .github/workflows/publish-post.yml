name: Publish Reviewed AI Tech Series
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Approved draft IDs: 1838,1840,1843'
        required: true
        type: string
      apply:
        description: 'Upload verified covers and publish reviewed drafts'
        type: boolean
        default: false
concurrency:
  group: trendpulse-ai-tech-series-20261006
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Upload covers and publish approved drafts via API
        env:
          WP_GENERAL_URL: ${{ secrets.WP_GENERAL_URL }}
          WP_GENERAL_USERNAME: ${{ secrets.WP_GENERAL_USERNAME }}
          WP_GENERAL_APP_PASSWORD: ${{ secrets.WP_GENERAL_APP_PASSWORD }}
          POC_POST_ID: ${{ inputs.post_id }}
          APPLY: ${{ inputs.apply }}
        run: python scripts/publish_ai_tech_series.py
