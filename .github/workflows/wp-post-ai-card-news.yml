name: WP Post - AI Tech Telegram Cards
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate cards without Telegram delivery
        type: boolean
        default: false
      force_legacy:
        description: Rollback only - send from this repository after the cutover date
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: wp-post-ai-news-card-bot
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wp-post/ai-news-card-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wp-post/ai-news-card-bot/requirements.txt
      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Unit and layout tests
        run: python -m unittest -v test_main
      - name: Generate and deliver
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE_LEGACY: ${{ inputs.force_legacy && '1' || '0' }}
          CARD_NEWS_CUTOVER_DATE: ${{ vars.CARD_NEWS_CUTOVER_DATE }}
        run: python main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-news-card-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: wp-post/ai-news-card-bot/output/
          retention-days: 14
